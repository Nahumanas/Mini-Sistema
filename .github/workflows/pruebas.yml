# Cada vez que se sube un cambio (o se abre un PR), GitHub corre las pruebas y el revisor de código.
# Si algo se rompió, aparece una cruz roja en el PR antes de publicarlo.
name: Pruebas

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pruebas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run lint

  # Las tablas de Supabase y sus reglas RLS: prueba que un dueño nunca vea ni toque lo de otro.
  base-y-rls:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - run: bash supabase/pruebas/probar-en-local.sh
      # El camino de la CLI de Supabase (supabase db push) y el paso de "marcar las que ya se pegaron a mano".
      # La CLI solo se conecta con TLS (como Supabase), así que al PostgreSQL de prueba se le prende con un
      # certificado de un día hecho acá mismo.
      - name: Prender TLS en el PostgreSQL de prueba
        run: |
          openssl req -new -x509 -days 1 -nodes -subj "/CN=localhost" -out server.crt -keyout server.key 2>/dev/null
          docker cp server.crt ${{ job.services.postgres.id }}:/var/lib/postgresql/data/server.crt
          docker cp server.key ${{ job.services.postgres.id }}:/var/lib/postgresql/data/server.key
          docker exec ${{ job.services.postgres.id }} bash -c "chown postgres:postgres /var/lib/postgresql/data/server.* && chmod 600 /var/lib/postgresql/data/server.key"
          rm server.crt server.key
          psql -q -d postgres -c "alter system set ssl = on" -c "select pg_reload_conf()"
          sleep 1
          psql -tA -d postgres -c "show ssl"
      - uses: supabase/setup-cli@v1
        with:
          version: 2.58.5
      - run: bash supabase/pruebas/probar-cli.sh

  # La API (FastAPI): sus pedidos y que un dueño no pueda tocar lo de otro, contra una base de prueba.
  servidor:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
    defaults:
      run:
        working-directory: servidor
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: servidor/requirements-pruebas.txt
      - run: pip install -r requirements-pruebas.txt
      # pg_dump tiene que ser de la versión de la base (17) para la prueba de los respaldos
      - run: |
          sudo apt-get install -y -q postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y -q postgresql-client-17
          echo /usr/lib/postgresql/17/bin >> "$GITHUB_PATH"
      - run: pytest -q
