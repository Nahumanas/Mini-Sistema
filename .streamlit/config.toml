[theme]
base = "light"
# Los colores de verdad (claro y oscuro) están en tema.py. Acá van los que usa Streamlit por dentro
# (casillas marcadas, interruptores): el verde de Supabase y grises "transparentes" que sirven en los dos temas.
primaryColor = "#3ECF8E"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "rgba(127, 127, 127, 0.12)"
# Texto casi negro (en vez del gris de Streamlit) para que se lea bien sobre el fondo blanco
textColor = "#1B1F2A"
grayTextColor = "#4A5162"
borderColor = "rgba(127, 127, 127, 0.28)"
showWidgetBorder = true
# Letra más grande (Streamlit trae 16). Tipografía: Inter para todo y Manrope para los títulos
baseFontSize = 17
font = "Inter:https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap, sans-serif"
headingFont = "Manrope:https://fonts.googleapis.com/css2?family=Manrope:wght@600;700;800&display=swap, sans-serif"
headingFontWeights = [800, 700, 700]
baseRadius = "medium"

[theme.sidebar]
backgroundColor = "#EEF2F8"

[server]
# headless = true evita que Streamlit frene la primera vez pidiendo un email.
# El navegador lo abre iniciar.bat (o entrá vos a http://localhost:8501).
headless = true
runOnSave = true

[client]
# Oculta el botón "Deploy" y el menú de desarrollador de Streamlit
toolbarMode = "minimal"

[browser]
gatherUsageStats = false
